<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange</title>
</head>
<body>
    <h1>Welcome to Crypto Exchange</h1>

    <div id="userAccounts">
        <h2>User Accounts</h2>
        <ul id="accountsList"></ul>
    </div>

    <div id="coinData">
        <h2>Coin Data</h2>
        <ul id="coinsList"></ul>
    </div>

    <script>
        // Fetch and display user accounts
        async function fetchUserAccounts(username) {
            const response = await fetch(`/accounts?username=${username}`);
            const data = await response.json();

            const accountsList = document.getElementById("accountsList");
            accountsList.innerHTML = '';
            data.forEach(account => {
                const li = document.createElement("li");
                li.textContent = `${account.owner} - ${account.type} - Balance: ${account.balance}`;
                accountsList.appendChild(li);
            });
        }

        // Fetch and display coin data
        async function fetchCoinData() {
            const response = await fetch('/coins');
            const data = await response.json();

            const coinsList = document.getElementById("coinsList");
            coinsList.innerHTML = '';
            for (const coinId in data) {
                const coin = data[coinId];
                const li = document.createElement("li");
                li.textContent = `${coin.name}: $${coin.current_price}`;
                coinsList.appendChild(li);
            }
        }

        // Example: Replace with a valid username
        const username = 'marius';
        fetchUserAccounts(username);
        fetchCoinData();
    </script>
</body>
</html>
