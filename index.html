<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange Interface</title>
    <script>
        async function fetchCoinsData() {
            const response = await fetch('http://localhost:8080');
            const data = await response.json();
            const coins = data.coins;

            let coinsList = '';
            coins.forEach(coin => {
                coinsList += `
                            <h3>${coin.name}</h3>
                            <p>Price (USD): ${coin.current_price}</p>
                            <p>24h Change: ${coin.price_change_percentage_24h}%</p>
                            <p>Circulating Supply: ${coin.circulating_supply}</p>
                            <p>24h High: ${coin.high_24h}</p>
                            <p>24h Low: ${coin.low_24h}</p>
                            <hr />
                        `;
            });
            document.getElementById('coinsData').innerHTML = coinsList;
        }

        // Call the function when the page loads
        window.onload = fetchCoinsData;
    </script>
</head>
<body>
    <h1>Crypto Exchange</h1>
    <div id="coinsData"></div>
</body>
</html>
